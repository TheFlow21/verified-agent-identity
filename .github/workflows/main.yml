name: Verify AI Agent Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: "Nama Agent"
        required: true
        default: "theflow21"
      agent_description:
        description: "Deskripsi Agent"
        required: true
        default: "theflow21 AI Agent"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Debug
      - name: Debug Environment
        run: |
          node -v
          npm -v
          which node
          which npm

      # ✅ 4. INSTALL CLAWHUB (FIX UTAMA)
      - name: Install ClawHub CLI
        run: |
          npm install -g clawhub

      - name: Verify ClawHub Install
        run: |
          clawhub --version || echo "ClawHub not found"

      # ✅ 5. INSTALL SKILL (NON-INTERACTIVE + FALLBACK)
      - name: Install ClawHub Skill
        run: |
          clawhub install verified-agent-identity --yes || \
          (echo "Retry install..." && sleep 5 && clawhub install verified-agent-identity --yes) || \
          echo "WARNING: Skill install failed, continuing..."

      # 6. Install dependencies
      - name: Install script dependencies
        run: |
          if [ -d "scripts" ]; then
            cd scripts
            npm install
            cd ..
          fi

      # 7. Create Identity
      - name: Step 2 - Create new Ethereum Identity
        run: |
          if [ ! -f "scripts/createNewEthereumIdentity.js" ]; then
            echo "Script tidak ditemukan!"
            exit 1
          fi
          node scripts/createNewEthereumIdentity.js

      # ✅ 8. FIX JSON TANPA jq
      - name: Step 3 - Link Human to Agent
        env:
          AGENT_NAME: ${{ github.event.inputs.agent_name }}
          AGENT_DESC: ${{ github.event.inputs.agent_description }}
        run: |
          if [ ! -f "scripts/manualLinkHumanToAgent.js" ]; then
            echo "Script tidak ditemukan!"
            exit 1
          fi

          CHALLENGE="{\"name\":\"$AGENT_NAME\",\"description\":\"$AGENT_DESC\"}"
          echo "Challenge: $CHALLENGE"

          node scripts/manualLinkHumanToAgent.js --challenge "$CHALLENGE"

      # 9. Debug kalau gagal
      - name: Debug on failure
        if: failure()
        run: |
          echo "Workflow failed"
          ls -R
